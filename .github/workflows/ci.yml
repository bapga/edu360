name: EDU360 CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Dependency audit summary
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log('Dependency audit:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ' | range=' + item.range + ' | fix=' + JSON.stringify(item.fixAvailable))"
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/edu360-permission-hardening'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): add npm lockfile"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/edu360-permission-hardening'
        uses: actions/upload-artifact@v4
        with:
          name: edu360-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
